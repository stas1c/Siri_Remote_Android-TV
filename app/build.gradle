plugins {
    id 'com.android.application'
}

android {
    namespace 'net.sk4pro.siriremote'
    compileSdk 34
    defaultConfig {
        applicationId 'net.sk4pro.siriremote'
        minSdk 33
        targetSdk 34
        versionCode 3
        versionName '1.1'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // installed as a priv-app from the Magisk module, never published
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
